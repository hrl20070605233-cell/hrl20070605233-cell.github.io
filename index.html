<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学招聘信息</title>
    <style>
        /* ... 其他样式 ... */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .pagination button {
            padding: 8px 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .job-card {
            display: none; /* 默认隐藏所有卡片 */
        }
        .job-card.active {
            display: block; /* 只显示当前页的卡片 */
        }
    </style>
</head>
<body>
    <h1>南开大学招聘信息</h1>
    <p>共 <span id="total-count">0</span> 条招聘信息</p>
    
    <div id="jobs-container"></div>
    
    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">上一页</button>
        <span id="page-info">第 1 页 / 共 1 页</span>
        <button id="next-btn" onclick="changePage(1)">下一页</button>
    </div>

    <script>
        const PAGE_SIZE = 20; // 每页显示20条
        let currentPage = 1;
        let jobsData = [];

        // 加载数据
        fetch('jobs.json')
            .then(response => response.json())
            .then(data => {
                jobsData = data;
                document.getElementById('total-count').textContent = data.length;
                renderPage(1);
            })
            .catch(error => console.error('加载数据失败:', error));

        function renderPage(page) {
            const container = document.getElementById('jobs-container');
            const totalPages = Math.ceil(jobsData.length / PAGE_SIZE);
            
            // 清空容器
            container.innerHTML = '';
            
            // 计算当前页的数据
            const start = (page - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, jobsData.length);
            const pageData = jobsData.slice(start, end);
            
            // 渲染当前页的数据
            pageData.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card active';
                card.innerHTML = `
                    <h3>${job.title}</h3>
                    <p>发布时间：${job.date}</p>
                    <p>${job.description}</p>
                    <a href="${job.link}" target="_blank">查看详情</a>
                `;
                container.appendChild(card);
            });
            
            // 更新分页信息
            currentPage = page;
            document.getElementById('page-info').textContent = `第 ${page} 页 / 共 ${totalPages} 页`;
            document.getElementById('prev-btn').disabled = page === 1;
            document.getElementById('next-btn').disabled = page === totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(jobsData.length / PAGE_SIZE);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                renderPage(newPage);
            }
        }
    </script>
</body>
</html>
