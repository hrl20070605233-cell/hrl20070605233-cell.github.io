<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学招聘信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1 { color: #1a73e8; margin-bottom: 20px; }
        
        .filters { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        .filters select, .filters input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        
        .job-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .job-card h3 { color: #333; margin-bottom: 10px; }
        .job-card p { color: #666; margin: 5px 0; }
        .job-card a { color: #1a73e8; text-decoration: none; }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .pagination button { padding: 8px 16px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .pagination button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>南开大学招聘信息</h1>
    
    <div class="filters">
        <input type="text" id="search-input" placeholder="搜索职位..." oninput="applyFilters()">
        <select id="category-filter" onchange="applyFilters()">
            <option value="">所有类别</option>
        </select>
    </div>
    
    <p>共 <span id="total-count">0</span> 条招聘信息</p>
    <div id="jobs-container"></div>
    
    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">上一页</button>
        <span id="page-info">第 1 页 / 共 1 页</span>
        <button id="next-btn" onclick="changePage(1)">下一页</button>
    </div>

    <script>
        const PAGE_SIZE = 20;
        let currentPage = 1;
        let allJobs = [];
        let filteredJobs = [];

        // 加载数据 - 使用你的简化版方式
        fetch('jobs.json')
            .then(response => response.json())
            .then(data => {
                allJobs = data;
                filteredJobs = [...allJobs];
                document.getElementById('total-count').textContent = data.length;
                updateFilters();
                renderPage(1);
            })
            .catch(error => console.error('加载数据失败:', error));

        function updateFilters() {
            const categories = [...new Set(allJobs.map(job => job.category))];
            const select = document.getElementById('category-filter');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            
            filteredJobs = allJobs.filter(job => {
                const matchSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) || 
                    job.description.toLowerCase().includes(searchTerm);
                const matchCategory = !category || job.category === category;
                return matchSearch && matchCategory;
            });
            
            document.getElementById('total-count').textContent = filteredJobs.length;
            renderPage(1);
        }

        function renderPage(page) {
            const container = document.getElementById('jobs-container');
            const totalPages = Math.ceil(filteredJobs.length / PAGE_SIZE);
            
            container.innerHTML = '';
            
            const start = (page - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filteredJobs.length);
            const pageData = filteredJobs.slice(start, end);
            
            pageData.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <h3>${job.title}</h3>
                    <p>📅 发布时间：${job.date}</p>
                    <p>📂 类别：${job.category}</p>
                    <p>${job.description}</p>
                    <a href="${job.link}" target="_blank">查看详情 →</a>
                `;
                container.appendChild(card);
            });
            
            currentPage = page;
            document.getElementById('page-info').textContent = `第 ${page} 页 / 共 ${totalPages} 页`;
            document.getElementById('prev-btn').disabled = page === 1;
            document.getElementById('next-btn').disabled = page === totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredJobs.length / PAGE_SIZE);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                renderPage(newPage);
            }
        }
    </script>
</body>
</html>
