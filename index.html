<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学就业信息网 - 招聘信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .header-content h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            margin: 1rem 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .filter-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            margin: 1rem 2rem;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            margin-bottom: 1rem;
        }

        #searchInput {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        #searchInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filters select {
            flex: 1;
            min-width: 150px;
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .filters select:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e0e0e0;
        }

        #refreshBtn {
            padding: 0.5rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #refreshBtn:hover {
            background: #5a67d8;
        }

        .job-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .job-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: #667eea;
        }

        .job-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .job-card .company {
            font-size: 1rem;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .job-card .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .job-card .tag {
            padding: 0.3rem 0.8rem;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #666;
        }

        .job-card .tag.location {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .job-card .tag.degree {
            background: #e3f2fd;
            color: #1565c0;
        }

        .job-card .tag.salary {
            background: #fff3e0;
            color: #e65100;
        }

        .job-card .tag.time {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .job-card .description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
            color: #7f8c8d;
        }

        .footer-content p {
            margin: 0.3rem 0;
        }

        @media (max-width: 768px) {
            .stats-bar {
                flex-wrap: wrap;
                gap: 1rem;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .filters select {
                width: 100%;
            }
            
            .job-list {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            
            header {
                padding: 1rem;
            }
            
            .header-content h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🎯 南开大学就业信息网</h1>
            <p class="subtitle">实时更新校园招聘、实习招聘、宣讲会信息</p>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-number" id="totalJobs">0</span>
            <span class="stat-label">总职位数</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="campusJobs">0</span>
            <span class="stat-label">校园招聘</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="internJobs">0</span>
            <span class="stat-label">实习招聘</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="lectureJobs">0</span>
            <span class="stat-label">宣讲会</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="newJobs">0</span>
            <span class="stat-label">今日新增</span>
        </div>
    </div>

    <div class="filter-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索职位名称、公司名称...">
        </div>
        
        <div class="filters">
            <select id="categoryFilter">
                <option value="all">全部类型</option>
                <option value="校园招聘">校园招聘</option>
                <option value="实习招聘">实习招聘</option>
                <option value="宣讲会">宣讲会</option>
            </select>
            
            <select id="locationFilter">
                <option value="all">全部地点</option>
            </select>
            
            <select id="degreeFilter">
                <option value="all">全部学历</option>
                <option value="本科">本科</option>
                <option value="硕士">硕士</option>
                <option value="博士">博士</option>
                <option value="不限">不限</option>
            </select>
            
            <select id="sortFilter">
                <option value="time">按发布时间排序</option>
                <option value="title">按职位名称排序</option>
                <option value="company">按公司名称排序</option>
            </select>
        </div>
        
        <div class="filter-info">
            <span id="resultCount">共 0 个职位</span>
            <button id="refreshBtn" onclick="loadJobs()">🔄 刷新数据</button>
        </div>
    </div>

    <div class="job-list" id="jobList">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载数据...</p>
        </div>
    </div>

    <div class="modal" id="jobModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>数据来源：南开大学就业信息网</p>
            <p id="updateTime">最后更新：加载中...</p>
            <p>© 2024 南开大学就业信息网 - 招聘信息展示</p>
        </div>
    </footer>

    <script>
        let allJobs = [];
        let filteredJobs = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadJobs();
            setupEventListeners();
        });

        async function loadJobs() {
            showLoading();
            
            try {
                const response = await fetch('jobs.json');
                if (!response.ok) {
                    throw new Error('无法加载数据');
                }
                
                const data = await response.json();
                
                // 处理爬虫返回的数据格式
                if (Array.isArray(data)) {
                    allJobs = data;
                } else if (data.jobs) {
                    allJobs = data.jobs;
                } else {
                    allJobs = [];
                }
                
                updateStats();
                updateLocationFilter();
                applyFilters();
                
                document.getElementById('updateTime').textContent = 
                    `最后更新：${new Date().toLocaleString('zh-CN')}`;
                    
            } catch (error) {
                console.error('加载数据失败:', error);
                showError('数据加载失败，请确保已运行爬虫生成 jobs.json 文件');
            }
        }

        function showLoading() {
            const jobList = document.getElementById('jobList');
            jobList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在加载数据...</p>
                </div>
            `;
        }

        function showError(message) {
            const jobList = document.getElementById('jobList');
            jobList.innerHTML = `
                <div class="loading">
                    <p style="color: #e53e3e;">❌ ${message}</p>
                    <button onclick="loadJobs()" style="
                        margin-top: 1rem;
                        padding: 0.5rem 1.5rem;
                        background: #667eea;
                        color: white;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                    ">重新加载</button>
                </div>
            `;
        }

        function updateStats() {
            document.getElementById('totalJobs').textContent = allJobs.length;
            
            const campusJobs = allJobs.filter(job => job.category === '校园招聘');
            const internJobs = allJobs.filter(job => job.category === '实习招聘');
            const lectureJobs = allJobs.filter(job => job.category === '宣讲会');
            
            document.getElementById('campusJobs').textContent = campusJobs.length;
            document.getElementById('internJobs').textContent = internJobs.length;
            document.getElementById('lectureJobs').textContent = lectureJobs.length;
            
            const today = new Date().toISOString().split('T')[0];
            const newJobs = allJobs.filter(job => {
                const pubTime = job.pub_time || '';
                return pubTime.includes(today);
            });
            document.getElementById('newJobs').textContent = newJobs.length;
        }

        function updateLocationFilter() {
            const locations = [...new Set(allJobs.map(job => job.location).filter(Boolean))];
            const select = document.getElementById('locationFilter');
            
            select.innerHTML = '<option value="all">全部地点</option>';
            
            locations.forEach(location => {
                if (location) {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    select.appendChild(option);
                }
            });
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', debounce(function() {
                applyFilters();
            }, 300));
            
            document.getElementById('categoryFilter').addEventListener('change', applyFilters);
            document.getElementById('locationFilter').addEventListener('change', applyFilters);
            document.getElementById('degreeFilter').addEventListener('change', applyFilters);
            document.getElementById('sortFilter').addEventListener('change', applyFilters);
        }

        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;
            const degree = document.getElementById('degreeFilter').value;
            const sortBy = document.getElementById('sortFilter').value;
            
            filteredJobs = allJobs.filter(job => {
                if (searchTerm) {
                    const titleMatch = job.title && job.title.toLowerCase().includes(searchTerm);
                    const companyMatch = job.company && job.company.toLowerCase().includes(searchTerm);
                    if (!titleMatch && !companyMatch) return false;
                }
                
                if (category !== 'all' && job.category !== category) return false;
                if (location !== 'all' && job.location !== location) return false;
                if (degree !== 'all' && job.degree !== degree) return false;
                
                return true;
            });
            
            // 排序
            if (sortBy === 'title') {
                filteredJobs.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            } else if (sortBy === 'company') {
                filteredJobs.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
            } else {
                filteredJobs.sort((a, b) => {
                    const timeA = a.pub_time || '';
                    const timeB
