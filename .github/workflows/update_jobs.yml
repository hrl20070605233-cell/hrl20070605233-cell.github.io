name: 自动更新招聘信息

on:
  # 定时触发：每6小时更新一次
  schedule:
    - cron: '0 */6 * * *'  # 每天0点、6点、12点、18点更新
  
  # 手动触发：可以在GitHub页面点击按钮手动更新
  workflow_dispatch:
  
  # 代码推送时触发
  push:
    branches: [ main ]

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: 运行爬虫更新数据
      run: |
        python scraper.py
        echo "爬虫运行完成"
    
    - name: 检查数据是否更新
      id: check_changes
      run: |
        # 检查jobs.json是否有变化
        if git diff --quiet jobs.json; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "数据没有变化，跳过提交"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "数据已更新，准备提交"
        fi
    
    - name: 提交更新到GitHub
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add jobs.json
        git commit -m "🔄 自动更新招聘信息 - $(date '+%Y-%m-%d %H:%M:%S')"
        git push
