name: 自动更新招聘信息

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点运行
  workflow_dispatch:      # 允许手动触发

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4  # 保持 v4，警告不影响运行
      
    - name: 设置 Python
      uses: actions/setup-python@v5  # 保持 v5，警告不影响运行
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: 运行更新脚本
      run: python update_jobs.py
      
    - name: 提交更改
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "自动更新招聘信息"
        git push
